name: Build macOS App

on:
  push:
    branches:
      - native-build-experiment

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - name: Make gradlew executable
        working-directory: ./backend
        run: chmod +x ./gradlew

      - name: Build Native Image
        working-directory: ./backend
        run: ./gradlew nativeCompile

      - name: Package Mac .app Bundle
        run: |
          mkdir -p FarmersMarket.app/Contents/MacOS
          mkdir -p FarmersMarket.app/Contents/Resources
          cp backend/build/native/nativeCompile/farmers_market FarmersMarket.app/Contents/MacOS/
          
          # Fix: Comments are properly indented so YAML doesn't panic
          # cp backend/icons/icon.icns FarmersMarket.app/Contents/Resources/
          
          # Fix: Safely writing the XML using echo to avoid bash EOF whitespace issues
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>farmers_market</string>
              <key>CFBundleIdentifier</key>
              <string>com.csi43C9.farmersmarket</string>
              <key>CFBundleName</key>
              <string>Farmers Market</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>' > FarmersMarket.app/Contents/Info.plist

      - name: Zip the App Bundle
        run: zip -r FarmersMarket-macOS.zip FarmersMarket.app

      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: farmers-market-mac
          # Upload the zip file we just created, NOT the raw folder
          path: FarmersMarket-macOS.zip