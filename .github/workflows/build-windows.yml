name: Build Windows Executable

on:
  push:
    branches:
      - native-build-experiment

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # BUILD THE SPRING BOOT SIDECAR
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: 'gradle'

      - name: Build Spring Boot Native Image
        working-directory: ./backend
        env:
          GRADLE_OPTS: "-Djava.io.tmpdir=${{ github.workspace }}\\backend\\build\\tmp"
        run: |
          mkdir -Force build\tmp
          .\gradlew.bat nativeCompile

      - name: Prepare Tauri Sidecar
        run: |
          New-Item -ItemType Directory -Force -Path "frontend\src-tauri\binaries"
          Copy-Item -Path "backend\build\native\nativeCompile\farmers-market.exe" -Destination "frontend\src-tauri\binaries\spring-backend-x86_64-pc-windows-msvc.exe" -Force

      # BUILD THE FRONTEND & TAURI APP
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build and Bundle Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_API_URL: 'http://localhost:8080'
        with:
          projectPath: ./frontend
          tagName: app-v__VERSION__
          releaseName: "MarketOS Windows Release v__VERSION__"
          releaseBody: "Automated Windows build."
          releaseDraft: true
          prerelease: false