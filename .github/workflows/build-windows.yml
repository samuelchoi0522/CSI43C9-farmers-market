name: Build Windows Executable

on:
  push:
    branches:
      - native-build-experiment

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - name: Build Native Image
        working-directory: ./backend
        run: |
            mkdir -Force build\tmp
            .\gradlew.bat nativeCompile -Djava.io.tmpdir="${{ github.workspace }}\backend\build\tmp"

      # (Optional) Uncomment when the .ico file is ready
      # - name: Download rcedit
      #   run: Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
      #
      # - name: Embed Icon into EXE
      #   run: .\rcedit.exe backend/build/native/nativeCompile/farmers_market.exe --set-icon backend/icons/icon.ico

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: farmers-market-windows
          path: backend/build/native/nativeCompile/farmers_market.exe