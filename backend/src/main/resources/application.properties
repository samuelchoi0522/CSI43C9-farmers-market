spring.application.name=MarketOS

# ===============================
# = DATASOURCE
# ===============================
# The properties below use the format ${ENV_VARIABLE:default_value}.
# Spring Boot will use the value of the environment variable if it exists,
# otherwise it will fall back to the default value.

# JDBC URL for MySQL
# Env: SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/farmers_market_db}

# Database Username
# Env: SPRING_DATASOURCE_USERNAME
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

# Database Password
# Env: SPRING_DATASOURCE_PASSWORD
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Database Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JWT
# ===============================
# Secret key for signing JWTs. In production, this should be a long, random string
# and must be provided via the FARMERS_MARKET_JWT_SECRET environment variable.
farmers.market.jwt.secret=${FARMERS_MARKET_JWT_SECRET}

# Expiration time for JWTs in milliseconds (e.g., 15 minutes = 900000 milliseconds)
farmers.market.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Expiration time for refresh tokens in milliseconds (e.g., 604800000 for 7 days)
farmers.market.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
