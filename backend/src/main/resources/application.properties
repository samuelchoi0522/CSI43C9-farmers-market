spring.application.name=MarketOS

# ===============================
# = DATASOURCE
# ===============================
# The properties below use the format ${ENV_VARIABLE:default_value}.
# Spring Boot will use the value of the environment variable if it exists,
# otherwise it will fall back to the default value.

# Uses the dynamic path we set in the main application class
spring.datasource.url=jdbc:h2:file:${app.data.dir}/market_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
